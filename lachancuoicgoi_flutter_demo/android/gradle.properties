org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.overridePathCheck=true
ksp.useKSP2=false
# NOTE: kotlin.incremental=true may throw "this and base files have different roots"
# when the Pub cache (C:\Users\...\AppData\Local\Pub\Cache) and the project live on
# different drives. The Kotlin daemon auto-falls-back to non-incremental compilation,
# so the build still succeeds (just slower) — the stack trace in the log is noisy but
# harmless. To silence it completely, set this to false (at the cost of slower builds).
kotlin.incremental=true
android.builtInKotlin=false
android.newDsl=false
kotlin.jvm.target.validation.mode=warning
android.disableKgpWarning=true
org.gradle.caching=true
org.gradle.parallel=true
